<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Mc Market</title>

    <link rel="icon" type="image/png" href="/images/mc-market-logo.png">
    <link rel="stylesheet" href="/css/market.css">
</head>

<body>

    <main class="mc-home">

        <div class="mc-auth-card">

            <img
                src="/images/mc-market-logo.png"
                alt="Logo Mc Market"
            >

            <h1>MC MARKET</h1>
            <p class="subtitle">Connectez-vous à votre compte</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                    >
                </div>

                <button type="submit" class="mc-auth-button">
                    Connexion
                </button>

                <p id="message" class="mc-message"></p>

            </form>

            <div class="mc-switch">
                Pas encore de compte ?
                <a href="/register.html">Créer un compte</a>
            </div>

        </div>

    </main>

    <script src="/js/matrix.js"></script>
    <script src="/js/login.js"></script>

</body>

</html>
